[project]
name = "it-helpdesk-agent"
version = "0.1.0"
description = "Production-ready 3-Tier IT Helpdesk Multi-Agent AI System powered by Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "google-adk>=1.27.4,<2.0.0",
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.124.1",
    "uvicorn>=0.29.0",
    "google-cloud-logging>=3.0.0",
    "google-cloud-aiplatform>=1.38.0",
    "fastmcp>=2.13.0",
    "google-cloud-storage>=3.6.0",
    "google-auth>=2.0.0",
    "google-cloud-secret-manager>=2.26.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
