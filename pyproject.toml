[project]
name = "agent-core"
version = "2.0.0"
description = "Production-ready Enterprise Multi-Agent AI Platform with Domain Packs, BigQuery Vector RAG, and Google ADK."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "google-adk>=1.27.4,<2.0.0",
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.124.1",
    "uvicorn>=0.29.0",
    "google-cloud-logging>=3.0.0",
    "google-cloud-aiplatform>=1.38.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-firestore>=2.15.0",
    "google-cloud-discoveryengine>=0.11.0",
    "fastmcp>=2.13.0",
    "google-cloud-storage>=3.6.0",
    "google-auth>=2.0.0",
    "google-cloud-secret-manager>=2.26.0",
    "pydantic>=2.0.0",
    "python-docx>=1.2.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0.1",
    "google-cloud-documentai>=2.20.0",
    "redis>=5.0.0",
    "google-api-python-client>=2.100.0",
    "a2a-sdk>=0.3.26,<0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.20.0",
    "locust>=2.20.0",
]
ingest = [
    "python-docx>=1.2.0",
    "pypdf>=4.0.0",
    "google-cloud-documentai>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "boot: marks slow subprocess boot tests requiring fresh process isolation",
]
