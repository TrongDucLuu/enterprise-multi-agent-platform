- id: ERP-KB-001
  system: ERP
  title: Khắc phục lỗi phân quyền Purchase Order (SAP/Oracle M_BEST_EKO)
  category: Finance & Procurement
  content: "Khi người dùng gặp lỗi 'Authorization check failed for Object M_BEST_EKO\
    \ (Activity 01/02)':\n1. Nguyên nhân: Tài khoản chưa được gán Role Z_PROC_PURCHASER\
    \ hoặc Purchasing Group bị giới hạn trong bảng T024.\n2. Quy trình xử lý:\n  \
    \ - Yêu cầu người dùng cung cấp mã Purchase Organization và Purchasing Group.\n\
    \   - Gửi yêu cầu phê duyệt đến Trưởng bộ phận mua hàng (Procurement Manager).\n\
    \   - Sau khi có phê duyệt, IT Admin gán T-code ME21N/ME22N và object M_BEST_EKO\
    \ thông qua hệ thống phân quyền SAP GRC.\n3. SLA xử lý: 2 giờ làm việc kể từ khi\
    \ có đủ phê duyệt."
