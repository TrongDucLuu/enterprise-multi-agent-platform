- id: HRM-KB-101
  system: HRM
  title: Xử lý lỗi đồng bộ chấm công và khóa bảng công Workday/BambooHR
  category: Timesheet & Payroll
  content: "Vấn đề nhân viên không thấy dữ liệu chấm công từ máy vân tay hoặc FaceID:\n\
    1. Nguyên nhân thường gặp:\n   - Service 'HR-Biometric-Sync' tại server 10.0.12.55\
    \ bị dừng.\n   - Mã nhân viên (Employee ID) trên máy chấm công không khớp với\
    \ mã trong HRM Core.\n2. Các bước xử lý:\n   - Bước 1: Kiểm tra kết nối mạng máy\
    \ chấm công tại chi nhánh qua ping IP nội bộ.\n   - Bước 2: Restart cronjob sync:\
    \ `systemctl restart hr-sync-agent`.\n   - Bước 3: Nếu bảng công tháng đã bị 'Payroll\
    \ Locked' sau ngày 25 hàng tháng, yêu cầu HR Operations gửi ticket mở khóa ngoại\
    \ lệ."
