- id: CRM-KB-209
  system: CRM
  title: Khắc phục sự cố gửi email tự động (Email Deliverability DKIM SPF) trong Marketing
    Cloud
  category: Marketing Operations
  content: 'Xử lý sự cố email marketing bị rơi vào hòm thư rác (Spam) hoặc bị trả
    về (Bounced):

    1. Kiểm tra bản ghi DNS xác thực Sender Authentication Package (SAP): SPF, DKIM
    2048-bit, và DMARC.

    2. Kiểm tra danh sách Bounce List: Loại bỏ ngay các địa chỉ Hard Bounce để bảo
    vệ chỉ số IP Reputation.

    3. Đảm bảo tất cả email gửi hàng loạt đều có liên kết hủy đăng ký (One-Click Unsubscribe)
    theo chuẩn quốc tế.'
