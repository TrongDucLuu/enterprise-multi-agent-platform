  title: Hướng dẫn tạo bảng báo giá Quote Template và quy trình phê duyệt chiết khấu
    Salesforce
  category: Sales Operations
  content: 'Quy trình tạo Báo giá (Quote) và duyệt chiết khấu đặc biệt (Discount Approval):

    1. Từ Opportunity tương ứng, nhấn ''New Quote'', chọn bảng giá (Price Book) và
    thêm sản phẩm.

    2. Mức chiết khấu từ 0-10% tự động duyệt; từ 11-20% cần Sales Director duyệt;
    trên 20% cần CFO duyệt qua email.

    3. Sau khi Quote được duyệt: Nhấn ''Generate PDF'' để gửi báo giá chính thức có
