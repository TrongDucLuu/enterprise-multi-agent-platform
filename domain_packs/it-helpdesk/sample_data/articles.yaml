- id: CRM-KB-210
  system: CRM
  title: Quy trình định tuyến Case hỗ trợ kỹ thuật khách hàng đa kênh Omnichannel
    Routing
  category: Customer Support
  content: 'Cấu hình phân bổ Ticket / Case hỗ trợ khách hàng tự động (Omnichannel
    Routing):

    1. Luồng tiếp nhận từ Email, LiveChat và Zalo OA được tự động gom về hàng đợi
    (Queue) phân theo kỹ năng.

    2. Hệ thống phân bổ Case cho nhân viên Support có trạng thái ''Available'' và
    tải công việc (Workload Capacity) thấp nhất.

    3. Cảnh báo tự động gửi cho Trưởng ca nếu Case mức độ nghiêm trọng High/Critical
    chưa được phản hồi sau 15 phút.'
