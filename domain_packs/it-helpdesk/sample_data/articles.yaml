- id: CRM-KB-201
  system: CRM
  title: Sự cố đồng bộ Lead & Cơ hội giữa CRM và Marketing Automation (Salesforce/HubSpot)
  category: Sales Operations
  content: "Khi đội Sales báo cáo Lead từ Web Form không đồng bộ vào CRM:\n1. Kiểm\
    \ tra Webhook Endpoint và API Limits của Salesforce/HubSpot:\n   - Giới hạn 24h\
    \ API Calls: Đảm bảo chưa vượt ngưỡng 90% Daily Limit.\n   - Kiểm tra trạng thái\
    \ OAuth Token của Integration User: Nếu token hết hạn, yêu cầu Admin re-authenticate.\n\
    2. Kiểm tra Validation Rules: Các trường bắt buộc như 'Country', 'Phone Number\
    \ Standard' bị từ chối do dữ liệu thô không hợp lệ.\n3. Khắc phục: Chạy lại batch\
    \ error queue trong CRM Integration Manager."
