  title: Ký hợp đồng điện tử và tích hợp DocuSign / Adobe Sign trên Salesforce CRM
  category: Contract Management
  content: 'Quy trình gửi hợp đồng kinh tế và theo dõi tiến độ chữ ký số điện tử:

    1. Từ màn hình Contract hoặc Opportunity, nhấn nút ''Send with DocuSign''.

    2. Chọn template hợp đồng mẫu, kéo thả các trường chữ ký, họ tên và ngày ký của
    Đại diện pháp luật khách hàng.

    3. Sau khi tất cả các bên hoàn tất ký số: File hợp đồng hoàn chỉnh có chứng thực
    dấu thời gian được tự động đính kèm vào CRM.'
