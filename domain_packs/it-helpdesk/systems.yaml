# Tiered Chunking Pipeline Strategy Configuration
chunking:
  default_strategy: "auto"                    # "auto" (section-aware with fallback), "fixed", "semantic"
  max_chunk_size: 1200                        # Maximum characters per chunk
  overlap: 150                                # Overlap characters between chunks
  well_structured_max_section_ratio: 0.65     # Section must not exceed 65% of total document length
  well_structured_min_avg_section_length: 100 # Average section length must be >= 100 characters
  systems:
    HRM:
      strategy: "semantic"                    # Example manual override flag for complex policy documents

# Document Processing & PDF Parsing Configuration
document_processing:
  pdf_parser: "pypdf_flat"                    # "pypdf_flat" (default, lightweight) or "document_ai"
  document_ai_processor_id: ""                # Mandatory if pdf_parser is "document_ai"
  document_ai_timeout_seconds: 60             # API timeout per call
  document_ai_max_retries: 2                  # Retry attempts with exponential backoff

# Enterprise RAG & BigQuery Retrieval Configuration
retrieval:
  fraction_lists_to_search: 0.05              # Fraction of IVF lists to search (0.0 to 1.0)
  hybrid_search_enabled: true                 # Enable lexical BM25/keyword boost alongside vector search
  reranker_enabled: false                     # Enable Vertex AI Reranker
  retrieve_k: 20                              # Number of initial candidate chunks retrieved
  final_k: 3                                  # Number of final authorized top results returned
  adaptive_retrieval_rounds: 2                # Max retrieval rounds if authorized count < final_k

# Rate Limiting & Cost Caps Configuration
rate_limiting:
  requests_per_minute: 60                     # Global API requests allowed per minute
  requests_per_day: 1000                      # Global API requests allowed per 24 hours
  l3_requests_per_minute: 10                  # L3 deep reasoning requests allowed per minute
  l3_requests_per_day: 100                    # L3 deep reasoning requests allowed per 24 hours
  monthly_token_budget: 0                     # Cluster-wide monthly token budget (0 = unlimited)


