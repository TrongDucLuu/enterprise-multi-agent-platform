name: CI/CD Pipeline - Enterprise Multi-Agent AI Platform

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Test & Validate Agent Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        environment:
          - name: "development"
            allow_local_dev_sso: "true"
          - name: "production"
            allow_local_dev_sso: "false"
        domain_pack: ["it-helpdesk"] # Reference domain pack for matrix validation
        include:
          - python-version: "3.12"
            environment:
              name: "development"
              allow_local_dev_sso: "true"
            domain_pack: "_template"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Project & Dev Dependencies
        run: |
          uv sync --dev

      - name: Run Pytest Suite (Unit, Security & Adversarial Tests)
        env:
          ENVIRONMENT: ${{ matrix.environment.name }}
          ALLOW_LOCAL_DEV_SSO: ${{ matrix.environment.allow_local_dev_sso }}
          DOMAIN_PACK: ${{ matrix.domain_pack }}
          ALLOWED_DOMAINS: "company.com"
          USE_VERTEX_EMBEDDING: "true"
          KNOWLEDGE_BACKEND: "in_memory"
          SEMANTIC_CACHE_ENABLED: "true"
          RATE_LIMIT_ENABLED: "true"
          ALLOWED_ARTIFACT_BUCKET: "company-artifacts-dev"
        run: |
          uv run pytest tests/ -v -m "not boot" --cov=agent_core --cov-report=term-missing

  boot-tests:
    name: Subprocess Boot Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Project & Dev Dependencies
        run: |
          uv sync --dev

      - name: Run Clean Boot Subprocess Tests
        env:
          ENVIRONMENT: "development"
          ALLOW_LOCAL_DEV_SSO: "true"
          ALLOWED_DOMAINS: "company.com"
          USE_VERTEX_EMBEDDING: "true"
          KNOWLEDGE_BACKEND: "in_memory"
        run: |
          uv run pytest tests/ -m "boot" -v

  terraform-validate:
    name: Validate Infrastructure as Code (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd deployment/terraform
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd deployment/terraform
          terraform init -backend=false
          terraform validate

