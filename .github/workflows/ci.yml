name: CI/CD Pipeline - IT Helpdesk Multi-Agent AI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Test & Validate Agent Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Pytest Suite (Unit, Security & Adversarial Tests)
        env:
          ALLOW_LOCAL_DEV_SSO: "true"
          SEMANTIC_CACHE_ENABLED: "true"
          RATE_LIMIT_ENABLED: "true"
        run: |
          pytest tests/ -v --cov=it_helpdesk_agent --cov-report=term-missing

      - name: Verify Enterprise Document Compilers
        run: |
          python generate_srs_document.py
          python generate_devops_runbook.py
          ls -lh PRODUCT_SRS_DOCUMENT.docx DEVOPS_RUNBOOK.docx

  terraform-validate:
    name: Validate Infrastructure as Code (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd deployment/terraform
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd deployment/terraform
          terraform init -backend=false
          terraform validate
