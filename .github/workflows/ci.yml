name: CI/CD Pipeline - IT Helpdesk Multi-Agent AI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Test & Validate Agent Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Project & Dev Dependencies
        run: |
          uv sync --dev

      - name: Run Pytest Suite (Unit, Security & Adversarial Tests)
        env:
          ALLOW_LOCAL_DEV_SSO: "true"
          SEMANTIC_CACHE_ENABLED: "true"
          RATE_LIMIT_ENABLED: "true"
        run: |
          uv run pytest tests/ -v --cov=agent_core --cov-report=term-missing

      - name: Verify Enterprise Document Compilers
        run: |
          uv run python generate_srs_document.py
          uv run python generate_devops_runbook.py
          test -f PRODUCT_SRS_DOCUMENT.docx
          test -f DEVOPS_RUNBOOK.docx

  terraform-validate:
    name: Validate Infrastructure as Code (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd deployment/terraform
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd deployment/terraform
          terraform init -backend=false
          terraform validate

